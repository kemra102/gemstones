---
name: Build Images
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "My Customized Fedora Image"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  REGISTRY_USER: ${{ github.repository_owner }}
  REGISTRY_PASSWORD: ${{ github.token }}
  SOURCE_REPO: "https://github.com/${{ github.repository }}"

jobs:
  includes_only:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image: quartz
            build_args: |
              BASE_CONTAINER=ghcr.io/ublue-os/kinoite-main:44
              BUILD_SCRIPT=quartz.sh
          - image: tourmaline
            build_args: |
              BASE_CONTAINER=ghcr.io/ublue-os/kinoite-main:latest
              BUILD_SCRIPT=tourmaline.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like that which is defined in the
          # ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          # https://github.com/docker/metadata-action#tags-input
          tags: |
            type=raw,value=latest
            type=raw,value=latest.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          # https://github.com/opencontainers/image-spec/blob/main/annotations.md
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md
            org.opencontainers.image.source=${{ env.SOURCE_REPO }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.url=${{ env.SOURCE_REPO }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=latest
            containers.bootc=1
            ostree.bootable=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: |
            ./Containerfile
          build-args: |
            ${{ matrix.build_args }}
          image: ${{ matrix.image }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
      
      # These `if` statements are so that pull requests for your custom images
      # do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things
      # like the merge queue (if you enable it), are going to work
      - name: Login to GHCR
        uses: redhat-actions/podman-login@v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ matrix.image }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
